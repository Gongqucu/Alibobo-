<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alibobo 问答 · 可爱大冒险</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 20% 20%, #fce2e6, #ffe4ec, #ffd9e6, #f9d8e6);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Fredoka', 'Segoe UI', 'Comic Neue', 'Poppins', cursive, sans-serif;
      padding: 16px;
      margin: 0;
      overflow: hidden;
      position: relative;
    }

    /* 漂浮的可爱背景元素 */
    body::before {
      content: "🌸 🐼 🌼 🍬 🎀 🧸 🌟 🍭 ✨ 💖 🦄 🌈";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      font-size: 3rem;
      opacity: 0.15;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-around;
      align-items: center;
      pointer-events: none;
      white-space: pre-wrap;
      line-height: 2.5;
      transform: rotate(-5deg) scale(1.2);
      z-index: 0;
    }

    /* 主卡片 — 更圆润、更软萌 */
    .card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 80px;
      padding: 44px 32px 52px;
      box-shadow: 0 30px 60px rgba(255, 120, 150, 0.3), 
                  0 0 0 8px rgba(255, 255, 255, 0.5),
                  0 0 0 12px rgba(255, 200, 220, 0.4),
                  inset 0 2px 20px rgba(255, 255, 255, 0.8);
      border: 3px dashed #ffb7c5;
      width: 100%;
      max-width: 760px;
      transition: all 0.3s ease;
      position: relative;
      z-index: 10;
    }

    /* 问题部分 */
    .question {
      text-align: center;
      margin-bottom: 44px;
      color: #5e3e4b;
      text-shadow: 2px 2px 0 #ffe2e9, 4px 4px 0 rgba(255, 200, 220, 0.6);
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .question .main-line {
      font-size: 2.6rem;
      line-height: 1.3;
      display: block;
      font-weight: 700;
      background: linear-gradient(145deg, #ff7b9c, #d44b74, #b33e5e);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 12px;
      filter: drop-shadow(0 4px 4px rgba(255, 180, 200, 0.6));
    }

    .question .sub-line {
      font-size: 1.8rem;
      opacity: 0.95;
      font-style: italic;
      color: #b3546e;
      font-weight: 500;
      background: rgba(255, 245, 250, 0.7);
      padding: 8px 24px;
      border-radius: 60px;
      display: inline-block;
      backdrop-filter: blur(5px);
      border: 2px dotted #ff9eb5;
      margin-top: 8px;
    }

    /* 按钮区域 */
    .buttons-area {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      flex-wrap: wrap;
      min-height: 200px;
      position: relative;
    }

    /* 基础按钮样式 — 更圆更萌 */
    .btn {
      border: none;
      cursor: pointer;
      font-weight: 800;
      font-size: 2rem;
      padding: 20px 60px;
      border-radius: 120px;
      transition: transform 0.08s ease-out, background 0.2s, box-shadow 0.2s, width 0.1s, height 0.1s, padding 0.1s, font-size 0.1s;
      letter-spacing: 2px;
      box-shadow: 0 14px 0 rgba(0, 0, 0, 0.1), 0 12px 30px rgba(255, 140, 170, 0.4);
      will-change: transform, left, top, font-size, padding;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      z-index: 100;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn:active {
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.1), 0 8px 18px rgba(255, 140, 170, 0.5);
    }

    /* 是 — 可爱粉色 */
    .btn-yes {
      background: linear-gradient(145deg, #ff9eb5, #ff6f91);
      color: white;
      text-shadow: 0 3px 6px rgba(200, 60, 90, 0.6);
      border: 4px solid #fff0f4;
      transform: scale(1);
      position: relative;
      z-index: 100;
      box-shadow: 0 14px 0 #b34e6b, 0 12px 30px rgba(255, 140, 170, 0.6);
    }

    /* 否 — 可爱绿色 */
    .btn-no {
      background: linear-gradient(145deg, #9be6b0, #4ccb6e);
      color: white;
      text-shadow: 0 3px 6px rgba(20, 100, 50, 0.6);
      border: 4px solid #e1ffe8;
      transform: scale(1);
      box-shadow: 0 14px 0 #2a8a4a, 0 12px 30px rgba(120, 220, 150, 0.6);
      transition: transform 0.12s ease, padding 0.12s, font-size 0.12s, background 0.2s, box-shadow 0.2s;
    }

    /* 感谢页面（覆盖层） */
    .thankyou-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 30% 30%, #fff0f5, #ffe2f0, #ffd9ec, #fce4f9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #4a2e3c;
      z-index: 1000;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.7s ease, visibility 0s 0.7s;
      pointer-events: none;
      text-align: center;
      overflow: hidden;
    }

    .thankyou-screen.active {
      visibility: visible;
      opacity: 1;
      transition: opacity 0.7s ease, visibility 0s 0s;
      pointer-events: auto;
    }

    .thankyou-content {
      position: relative;
      z-index: 1010;
      animation: popIn 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      max-width: 90vw;
      padding: 30px;
    }

    @keyframes popIn {
      0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
      70% { transform: scale(1.05) rotate(2deg); }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }

    /* 感谢标题 */
    .thankyou-content h1 {
      font-size: 3.8rem;
      font-weight: 900;
      background: linear-gradient(135deg, #ff6f91, #d44b74, #b33e5e);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 20px #ffb7c5, 6px 6px 0 #ffe2e9;
      margin-bottom: 25px;
      line-height: 1.3;
      letter-spacing: 2px;
      word-break: break-word;
    }

    /* 感谢正文 */
    .thankyou-content .message-box {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 80px;
      padding: 28px 36px;
      border: 5px dashed #ffa5b9;
      box-shadow: 0 30px 40px rgba(255, 150, 180, 0.3), inset 0 2px 20px #fff;
      max-width: 700px;
      margin: 0 auto;
    }

    .thankyou-content .message-box p {
      font-size: 2rem;
      font-weight: 600;
      color: #6b3e50;
      text-shadow: 2px 2px 0 #ffd9e6;
      line-height: 1.5;
      word-break: break-word;
    }

    .thankyou-content .message-box .emoji-row {
      font-size: 2.8rem;
      letter-spacing: 8px;
      margin-top: 18px;
      filter: drop-shadow(0 6px 6px rgba(255, 160, 190, 0.5));
    }

    /* 烟花画布 */
    #fireworksCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1005;
    }

    /* 喝彩小元素 — 浮动的心和星星 (增强效果) */
    .cheer-float {
      position: fixed;
      pointer-events: none;
      font-size: 2.2rem;
      z-index: 1008;
      animation: floatUp 2s ease-out forwards;
      opacity: 0.9;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 1; }
      100% { transform: translateY(-200px) scale(1.6); opacity: 0; }
    }

    /* 确保按钮没有其他干扰 */
    .buttons-area {
      position: relative;
    }

    /* 移动端调整 */
    @media (max-width: 600px) {
      .question .main-line { font-size: 1.8rem; }
      .question .sub-line { font-size: 1.3rem; }
      .btn { font-size: 1.5rem; padding: 16px 32px; }
      .thankyou-content h1 { font-size: 2.4rem; }
      .thankyou-content .message-box p { font-size: 1.4rem; }
      .thankyou-content .message-box .emoji-row { font-size: 2rem; }
    }
  </style>
  <!-- 导入可爱字体 -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- 主卡片 -->
  <div class="card" id="mainCard">
    <div class="question">
      <span class="main-line">Alibobo 🐻 do you think your little gongqu is fat or not? 🤔🍑</span>
      <span class="sub-line">tell the truth ！💢💖</span>
    </div>

    <div class="buttons-area" id="buttonsArea">
      <button class="btn btn-yes" id="yesBtn">YES 😳</button>
      <button class="btn btn-no" id="noBtn">NO 🥰</button>
    </div>
  </div>

  <!-- 感谢屏幕 -->
  <div class="thankyou-screen" id="thankyouScreen">
    <canvas id="fireworksCanvas"></canvas>
    <div class="thankyou-content">
      <h1>🎉🎊 Yayyy! Amazing! 🎊🎉</h1>
      <div class="message-box">
        <p>
          The answer is correct 🏆<br>
          congradulation 🎈<br>
          thank you my lovely Alibobo 💖<br>
          lovely you are lovely one now 🌟<br>
          lot of babaju 😘😘😘
        </p>
        <div class="emoji-row">
          💋 💋 💋 🎆 🎇 ✨ 💖 🐻 🌈
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ---------- 元素 ----------
      const yesBtn = document.getElementById('yesBtn');
      const noBtn = document.getElementById('noBtn');
      const buttonsArea = document.getElementById('buttonsArea');
      const mainCard = document.getElementById('mainCard');
      const thankyouScreen = document.getElementById('thankyouScreen');
      const fireworksCanvas = document.getElementById('fireworksCanvas');

      // ---------- 状态 ----------
      let yesClickCount = 0;
      const MAX_SHRINK = 0.15;
      const SHRINK_FACTOR = 0.85;
      const NO_GROW_FACTOR = 1.18;

      let yesFixed = false;
      // 用于记录原始位置，但我们用rect

      // ---------- 工具函数 ----------
      function getRandomInt(min, max) {
        return Math.random() * (max - min) + min;
      }

      // 生成安全随机位置
      function getSafeRandomPosition(btnWidth, btnHeight) {
        const margin = 20;
        const maxX = window.innerWidth - btnWidth - margin * 2;
        const maxY = window.innerHeight - btnHeight - margin * 2;
        const minX = margin;
        const minY = margin;

        if (maxX <= minX || maxY <= minY) {
          return {
            left: Math.max(0, (window.innerWidth - btnWidth) / 2),
            top: Math.max(0, (window.innerHeight - btnHeight) / 2)
          };
        }

        return {
          left: Math.min(maxX, Math.max(minX, Math.random() * (maxX - minX) + minX)),
          top: Math.min(maxY, Math.max(minY, Math.random() * (maxY - minY) + minY))
        };
      }

      // 更新no按钮尺寸（每次yes点击后变大）
      function updateNoButtonSize() {
        const scale = Math.pow(NO_GROW_FACTOR, yesClickCount);
        const maxScale = 5.0;
        const finalScale = Math.min(scale, maxScale);
        // 保留可爱的emoji和文字，但整体缩放
        noBtn.style.transform = `scale(${finalScale})`;
        // 增强阴影
        noBtn.style.boxShadow = `0 ${14 * finalScale}px 0 #2a8a4a, 0 ${12 * finalScale}px ${30 * finalScale}px rgba(120, 220, 150, 0.7)`;
        // 稍微提高z-index防止被覆盖
        noBtn.style.zIndex = 150 + yesClickCount;
      }

      // 重置no按钮样式
      function resetNoButton() {
        noBtn.style.transform = 'scale(1)';
        noBtn.style.boxShadow = '0 14px 0 #2a8a4a, 0 12px 30px rgba(120, 220, 150, 0.6)';
        noBtn.style.zIndex = '150';
      }

      // 处理yes点击
      function handleYesClick(e) {
        e.preventDefault();
        yesClickCount++;

        // 计算缩放
        let scale = Math.pow(SHRINK_FACTOR, yesClickCount);
        if (scale < MAX_SHRINK) scale = MAX_SHRINK;

        // 第一次点击时转为fixed定位
        if (!yesFixed) {
          const rect = yesBtn.getBoundingClientRect();
          yesBtn.style.position = 'fixed';
          yesBtn.style.left = rect.left + 'px';
          yesBtn.style.top = rect.top + 'px';
          yesBtn.style.margin = '0';
          yesBtn.style.zIndex = '2000';
          yesFixed = true;
        }

        // 应用缩放
        yesBtn.style.transform = `scale(${scale})`;

        // 获取变换后尺寸，然后随机移动
        const rectAfter = yesBtn.getBoundingClientRect();
        const btnWidth = rectAfter.width;
        const btnHeight = rectAfter.height;

        const { left, top } = getSafeRandomPosition(btnWidth, btnHeight);

        yesBtn.style.left = left + 'px';
        yesBtn.style.top = top + 'px';

        // 让NO变大
        updateNoButtonSize();

        // 额外可爱效果: 点击yes时冒出小汗滴或爱心？为了不干扰，加一点飘动emoji
        // 简单飘一个😅或者💦
        const sweat = document.createElement('div');
        sweat.textContent = ['😅','💦','😳','😣','🙈'][Math.floor(Math.random()*5)];
        sweat.style.position = 'fixed';
        sweat.style.left = (rectAfter.left + rectAfter.width/2) + 'px';
        sweat.style.top = (rectAfter.top) + 'px';
        sweat.style.fontSize = '2.5rem';
        sweat.style.pointerEvents = 'none';
        sweat.style.zIndex = '3000';
        sweat.style.transition = 'all 0.8s ease-out';
        sweat.style.opacity = '1';
        document.body.appendChild(sweat);
        requestAnimationFrame(() => {
          sweat.style.transform = 'translateY(-80px) scale(1.6)';
          sweat.style.opacity = '0';
        });
        setTimeout(() => sweat.remove(), 900);

        window.getSelection()?.removeAllRanges();
      }

      // 处理no点击 — 显示感谢屏幕 + 烟花 + 喝彩
      function handleNoClick(e) {
        e.preventDefault();
        noBtn.disabled = true;
        yesBtn.disabled = true;

        // 激活感谢屏幕
        thankyouScreen.classList.add('active');

        // 启动烟花
        startFireworks();

        // 额外喝彩效果：飘出爱心、星星、亲吻emoji
        startCheeringEmojis();
      }

      // 飘出喝彩emoji
      function startCheeringEmojis() {
        const emojis = ['💖','🎉','✨','😘','💋','🌟','🎊','💕','🌸','🐻','🌈','🍬','🥳','👏','🙌','💐'];
        const interval = setInterval(() => {
          if (!thankyouScreen.classList.contains('active')) {
            clearInterval(interval);
            return;
          }
          // 随机位置生成
          const el = document.createElement('div');
          el.className = 'cheer-float';
          el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
          el.style.left = Math.random() * window.innerWidth + 'px';
          el.style.top = window.innerHeight - 50 + 'px';
          el.style.fontSize = (1.8 + Math.random() * 2) + 'rem';
          el.style.animationDuration = (1.5 + Math.random() * 1.5) + 's';
          document.body.appendChild(el);

          // 动画结束后移除
          setTimeout(() => el.remove(), 2200);
        }, 180);

        // 5秒后减少频率? 不需要，让它持续到页面关闭或重置，但保留清理
        // 存储interval以便清理 (简单处理，不需要重置因为只有一次)
      }

      // ---------- 烟花效果 (可爱版) ----------
      let fireworksAnimationId = null;

      function startFireworks() {
        const canvas = fireworksCanvas;
        const ctx = canvas.getContext('2d');
        let width = window.innerWidth;
        let height = window.innerHeight;

        function resizeCanvas() {
          width = window.innerWidth;
          height = window.innerHeight;
          canvas.width = width;
          canvas.height = height;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let particles = [];
        const MAX_PARTICLES = 600;
        const GRAVITY = 0.05;

        // 可爱颜色
        const colors = ['#FF9EB5', '#FF6F91', '#D44B74', '#FFB7C5', '#FFD966', '#FFB347', '#AA96DA', '#B5EAD7', '#C7CEEA', '#FFC0CB', '#FFE2E9', '#FFA5B9'];

        function createBurst(x, y) {
          const count = 50 + Math.floor(Math.random() * 40);
          for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 2 + Math.random() * 7;
            const vx = Math.cos(angle) * speed;
            const vy = Math.sin(angle) * speed;
            particles.push({
              x, y,
              vx, vy,
              size: 4 + Math.random() * 6,
              color: colors[Math.floor(Math.random() * colors.length)],
              life: 1.0,
              decay: 0.008 + Math.random() * 0.02,
            });
          }
        }

        // 自动爆炸
        function autoBurst() {
          if (!thankyouScreen.classList.contains('active')) return;
          if (particles.length < MAX_PARTICLES - 120) {
            const x = Math.random() * width * 0.8 + width * 0.1;
            const y = Math.random() * height * 0.6 + height * 0.1;
            createBurst(x, y);
          }
          setTimeout(() => {
            if (thankyouScreen.classList.contains('active')) autoBurst();
          }, 350 + Math.random() * 600);
        }
        autoBurst();

        function animate() {
          if (!thankyouScreen.classList.contains('active')) {
            if (fireworksAnimationId) {
              cancelAnimationFrame(fireworksAnimationId);
              fireworksAnimationId = null;
            }
            return;
          }

          ctx.clearRect(0, 0, width, height);

          for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += GRAVITY;
            p.vx *= 0.99;
            p.vy *= 0.99;
            p.life -= p.decay;

            if (p.life <= 0 || p.x < 0 || p.x > width || p.y < 0 || p.y > height * 1.2) {
              particles.splice(i, 1);
              continue;
            }

            ctx.globalAlpha = p.life * 0.9;
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 25;
            ctx.beginPath();
            // 画成小爱心？但为了简单还是圆形加一点闪光，也可以画星星
            // 可爱一点画圆加小十字? 用圆形就好
            ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
            ctx.fill();

            // 额外小闪光
            if (Math.random() < 0.3) {
              ctx.fillStyle = '#FFFFFF';
              ctx.shadowBlur = 30;
              ctx.beginPath();
              ctx.arc(p.x + (Math.random()-0.5)*6, p.y + (Math.random()-0.5)*6, p.size*0.4, 0, Math.PI*2);
              ctx.fill();
            }
          }
          ctx.globalAlpha = 1;
          ctx.shadowBlur = 0;

          fireworksAnimationId = requestAnimationFrame(animate);
        }

        if (fireworksAnimationId) cancelAnimationFrame(fireworksAnimationId);
        fireworksAnimationId = requestAnimationFrame(animate);

        window.addEventListener('beforeunload', function() {
          if (fireworksAnimationId) cancelAnimationFrame(fireworksAnimationId);
        });
      }

      // ---------- 绑定事件 ----------
      yesBtn.addEventListener('click', handleYesClick);
      noBtn.addEventListener('click', handleNoClick);

      resetNoButton();

      // 窗口resize时，如果yes是fixed，约束位置
      window.addEventListener('resize', function() {
        if (yesFixed && yesBtn.style.position === 'fixed') {
          const rect = yesBtn.getBoundingClientRect();
          const maxX = window.innerWidth - rect.width - 10;
          const maxY = window.innerHeight - rect.height - 10;
          let left = parseFloat(yesBtn.style.left) || rect.left;
          let top = parseFloat(yesBtn.style.top) || rect.top;

          left = Math.min(Math.max(10, left), Math.max(10, maxX));
          top = Math.min(Math.max(10, top), Math.max(10, maxY));
          yesBtn.style.left = left + 'px';
          yesBtn.style.top = top + 'px';
        }
      });

      // 预防触摸延迟
    })();
  </script>
</body>
</html>
